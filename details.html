<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniNest – Property Details</title>
  <script>
    if (!localStorage.getItem("currentUser") || localStorage.getItem("currentUser") === "null") {
      window.location.replace("login.html?reason=auth_required");
    }
  </script>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .details-page { padding: 40px 0; }

    .back-btn {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }

    .back-btn:hover { text-decoration: underline; }

    .details-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 32px;
      align-items: start;
    }

    .details-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 24px;
    }

    .details-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .details-price {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .details-location {
      color: var(--text-light);
      margin-bottom: 24px;
      font-size: 15px;
    }

    .details-section {
      margin-bottom: 24px;
    }

    .details-section h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .amenities-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .amenity-tag {
      background: var(--bg);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    /* Contact Card */
    .contact-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 80px;
    }

    .contact-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .owner-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .owner-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .owner-name {
      font-weight: 600;
      font-size: 16px;
    }

    .owner-label {
      font-size: 13px;
      color: var(--text-light);
    }

    .contact-btn {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
    }

    .btn-call {
      background: var(--primary);
      color: white;
    }

    .btn-favorite {
      background: white;
      color: #e74c3c;
      border: 2px solid #e74c3c !important;
    }

    .btn-favorite:hover {
      background: #e74c3c;
      color: white;
    }

    .not-found {
      text-align: center;
      padding: 80px 0;
      color: var(--text-light);
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo"><i class="fa-solid fa-house" style="color:var(--primary)"></i> UniNest</div>
    <ul>
      <li><a href="index.html" data-i18n="navHome">Home</a></li>
      <li><a href="listings.html" data-i18n="navListings">Listings</a></li>
      <li><a href="login.html" class="btn-login" id="navLoginBtn" data-i18n="navLogin">Login</a></li>
      <li><a href="#" onclick="toggleDarkMode()" id="darkModeBtn"><i class="fa-solid fa-moon"></i></a></li>
      <li><a href="#" onclick="switchLang()" data-i18n="langToggle">عربي <i class="fa-solid fa-globe"></i></a></li>
    </ul>
  </nav>

  <div class="details-page">
    <div class="container">
      <a class="back-btn" onclick="history.back()" data-i18n="backToList">← Back to Listings</a>
      <div id="detailsContent"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p data-i18n="footerRight">© 2026 UniNest. Developed with ❤️ by EELU Students.</p>
  </footer>

  <script src="js/lang.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/data.js"></script>
  <script src="js/details.js"></script>

  <!-- Floating Contact Bar -->
  <div class="floating-bar">
    <a href="https://wa.me/1234567890" target="_blank" class="float-btn btn-whatsapp" title="Smart Assistant">
      <i class="fab fa-whatsapp"></i>
    </a>
    <a href="tel:01012345678" class="float-btn btn-phone" title="Call Us">
      <i class="fas fa-phone"></i>
    </a>
    <a href="mailto:info@uninest.com" class="float-btn btn-email" title="Email Us">
      <i class="fas fa-envelope"></i>
    </a>
  </div>
</body>
</html>
