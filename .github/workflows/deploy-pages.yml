name: Deploy UniNest to GitHub Pages

on:
  push:
    branches: ["main", "feature/connect-frontend-backend"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Static Frontend
        run: |
          set -euo pipefail
          mkdir -p _site/css _site/js
          cp ./*.html _site/
          cp manifest.json _site/
          cp -R css/. _site/css/
          cp -R js/. _site/js/
          test -s _site/index.html
          test -s _site/css/style.css
          echo "Prepared static frontend files for GitHub Pages."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
